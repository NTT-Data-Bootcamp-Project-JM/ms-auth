openapi: 3.1.0
info:
  title: Authentication
  description: Registers users and issues the bearer token used by the other services.
  version: 1.0.0
servers:
- url: http://127.0.0.1:8081
  description: Generated server url
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SingleResponseEntityTokenResponse"
  /api/v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SingleResponseEntityTokenResponse"
components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            type: string
      required:
      - password
      - username
    SingleResponseEntityTokenResponse: {}
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
