openapi: 3.0.3
info:
  title: Authentication
  version: 1.0.0
  description: >
    Source of the authentication API. The server interface is generated from this
    file. Registration and login are public and return a bearer token.
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Token for the new user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange credentials for a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  responses:
    BadRequest:
      description: The body is invalid or the credentials were rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        roles:
          type: array
          items:
            type: string
          description: Optional role names. CUSTOMER is used when this list is omitted.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresInMinutes]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInMinutes:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
